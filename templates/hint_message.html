<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Panel System - Message</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e6f0ff;
        }

        .card {
            width: 100%;
            max-width: 450px;
            border-radius: 15px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            border: none;
        }

        .card-title {
            color: #0d6efd;
            font-weight: 600;
        }

        .card-body {
            padding: 2rem;
        }
    </style>
</head>
<body>
<div class="card text-center">
    <div class="card-body" style="background-color: whitesmoke">
        <i class="fas fa-solar-panel fa-3x mb-3" style="color: #0d6efd;"></i>
        <h4 class="card-title mb-3">Hint Message</h4>
        <div class="alert alert-info" role="alert">
            <i class="fas fa-info-circle me-2"></i>
            {{ message }}
        </div>
        <a href="{% if id %}
                 {% url redirect id %}
                 {% else %}
                 {% url redirect %}
                 {% endif %}" class="btn btn-primary mt-3">
            Continue <i class="fas fa-arrow-right me-2"></i>
        </a>
    </div>
</div>

<!-- Bootstrap Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

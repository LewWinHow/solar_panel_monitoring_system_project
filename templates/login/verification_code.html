{% extends 'form_decoration.html' %}

{% block content %}
    <title>Verification Code</title>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="text-center mb-4 text-primary">Solar Panel Monitoring System</h1>
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="text-center mb-0">Verification Code</h3>
                </div>
                <div class="card-body p-4" style="background-color: whitesmoke">
                    <form method="post" class="needs-validation" novalidate>
                        {% csrf_token %}

                        <div class="mb-4">
                            <label for="verification_code" class="form-label">Verification Code</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-shield-lock"></i></span>
                                <input type="text" class="form-control" id="verification_code" name="verification_code" placeholder="Example: hpwg9u" required>
                            </div>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">Submit</button>
                        </div>
                        <div class="mt-4 text-center">
                            <a href="{% url 'login:forgot_password' %}" class="text-decoration-none text-primary"><- Back to Forgot Password</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'form_decoration.html' %}

{% block content %}
    <title>Forgot Password</title>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="text-center mb-4 text-primary">Solar Panel Monitoring System</h1>
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="text-center mb-0">Forgot Password</h3>
                </div>
                <div class="card-body p-4" style="background-color: whitesmoke">
                    <form method="post" class="needs-validation" novalidate>
                        {% csrf_token %}

                        <div class="mb-4">
                            <label for="email" class="form-label">Email address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" placeholder="Example: xiaohao6070@gmail.com" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="captcha" class="form-label">Captcha</label>
                            <div class="input-group mb-2">
                                <span class="input-group-text bg-light"><i class="bi bi-shield-lock"></i></span>
                              <input type="text" class="form-control" id="captcha" name="captcha" placeholder="Enter Captcha" required>
                            </div>
                            <div class="d-flex align-items-center mt-2">
                                 <canvas id="captchaCanvas" width="130" height="50" style="border: 1px solid #ccc;"></canvas>
                                <button type="button" class="btn btn-outline-secondary ms-3" onclick="generateCaptcha()">Refresh</button>
                        </div>
                             <input type="hidden" id="hide_captcha" name="hide_captcha" value="">
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">Submit</button>
                        </div>
                        <div class="mt-4 text-center">
                            <a href="{% url 'login:login' %}" class="text-decoration-none text-primary"><- Back to Login</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function generateCaptcha() {
  const canvas = document.getElementById("captchaCanvas");
  const ctx = canvas.getContext("2d");

  // 生成随机验证码
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789";
  let captcha = "";
  for (let i = 0; i < 5; i++) {
    captcha += chars.charAt(Math.floor(Math.random() * chars.length));
  }

  // 设置隐藏字段用于表单提交
  document.getElementById("hide_captcha").value = captcha;

  // 清空画布
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 背景
  ctx.fillStyle = "#f8f9fa";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 绘制验证码字符
  for (let i = 0; i < captcha.length; i++) {
    ctx.font = "24px Arial";
    ctx.fillStyle = getRandomColor();
    const x = 15 + i * 20;
    const y = 30 + Math.random() * 10;
    const angle = (Math.random() - 0.5) * 0.5;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.fillText(captcha[i], 0, 0);
    ctx.restore();
  }

  // 干扰线
  for (let i = 0; i < 4; i++) {
    ctx.strokeStyle = getRandomColor();
    ctx.beginPath();
    ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
    ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
    ctx.stroke();
  }
}

function getRandomColor() {
  const r = Math.floor(Math.random() * 150);
  const g = Math.floor(Math.random() * 150);
  const b = Math.floor(Math.random() * 150);
  return `rgb(${r}, ${g}, ${b})`;
}

// 页面加载完成后自动生成一次
window.onload = generateCaptcha;
</script>
{% endblock %}
